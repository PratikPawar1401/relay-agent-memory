name: relay
services:
  falkordb:
    image: falkordb/falkordb:v4.20.1
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync always"
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  sandbox:
    image: python:3.12.13-slim
    command: ["python", "/app/server.py"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./sandbox/server.py:/app/server.py:ro
      - sandbox-data:/data
    environment:
      SANDBOX_DB: /data/sandbox.sqlite
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  graph-data:
  sandbox-data:
